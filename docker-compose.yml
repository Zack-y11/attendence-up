services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: attendence
      POSTGRES_PASSWORD: attendence
      POSTGRES_DB: attendence
    ports:
      - "5434:5432"
    volumes:
      - attendence_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendence -d attendence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendence_pg:
